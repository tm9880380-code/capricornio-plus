<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Capricornio - Ruta</title><link rel="stylesheet" href="css/estilos.css"></head>
<body><header class="barra"><div class="logo"><span class="insignia"><img src="img/logo.webp" alt=""></span>CAPRICORNIO</div><nav><a href="plan.html">Mi plan</a><a href="diagnostico.html">Diagnóstico</a></nav></header><main class="contenedor"><p><a href="plan.html">← Volver a mi plan</a></p><h1 id="titulo">Ruta de aprendizaje</h1><p id="desc">Contenido organizado por módulos y lecciones.</p><div id="contenido"></div></main><footer class="pie-pagina">Capricornio · Aprende a tu ritmo</footer><script>
(async()=>{const area=new URLSearchParams(location.search).get("area");const root=document.getElementById("contenido");try{const r=await fetch("/api/learning/catalog",{credentials:"same-origin"});if(!r.ok)throw Error("Inicia sesión para ver tus rutas.");const d=await r.json();const track=d.tracks.find(x=>x.area===area)||d.tracks.find(x=>x.area===d.recommended_area);document.getElementById("titulo").textContent=track.area;document.getElementById("desc").textContent=track.completed+" de "+track.total+" lecciones completadas.";const groups={};track.lessons.forEach(l=>(groups[l.module]??=[]).push(l));Object.entries(groups).forEach(([name,lessons])=>{const card=document.createElement("section");card.className="tarjeta";card.style.margin="16px 0";const h=document.createElement("h2");h.textContent=name;card.append(h);lessons.forEach(l=>{const p=document.createElement("p");const a=document.createElement("a");a.href="leccion.html?id="+encodeURIComponent(l.id);a.textContent=(l.completed?"✓ ":"○ ")+l.title;p.append(a);card.append(p)});root.append(card)})}catch(e){root.textContent=e.message}})();
</script></body></html>
