<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capricornio - Iniciar sesión</title>
<style>
:root {
  color-scheme: light;
  --cafe-profundo: #2b1608;
  --cafe: #3b2314;
  --cafe-medio: #5a3a1e;
  --cafe-hover: #7a4a1c;
  --crema: #fffaf0;
  --crema-calida: #f6ecd6;
  --dorado-suave: #e6d3a8;
  --dorado: #b69a70;
  --texto-secundario: #806b55;
  --marfil: #f3e6c8;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--crema); }
body {
  min-height: 100vh; min-height: 100svh; margin: 0;
  display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(440px, .92fr);
  color: var(--cafe-profundo); background: var(--crema);
  font-family: "Trebuchet MS", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
.izquierda {
  position: relative; isolation: isolate; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; min-height: 100svh; padding: 72px 48px;
  text-align: center;
  background:
    radial-gradient(ellipse at 50% 44%, rgba(255,250,240,.72) 0%, rgba(246,236,214,.38) 43%, transparent 72%),
    linear-gradient(145deg, #f8efdD 0%, #ead9b7 100%);
}
.izquierda::before, .izquierda::after {
  position: absolute; z-index: -1; content: ""; pointer-events: none;
  border: 1px solid rgba(90,58,30,.13); border-radius: 50%;
}
.izquierda::before { width: min(78vw, 760px); aspect-ratio: 1; }
.izquierda::after { width: min(64vw, 610px); aspect-ratio: 1; }
.izquierda img {
  display: block; width: min(270px, 48vw); height: auto;
  mix-blend-mode: multiply;
  filter: drop-shadow(0 18px 24px rgba(43,22,8,.12));
}
.izquierda h2 {
  max-width: 440px; margin: 38px 0 0; color: var(--cafe-profundo);
  font-family: "Segoe UI", Arial, sans-serif;
  font-size: clamp(28px, 3vw, 40px); font-weight: 650;
  line-height: 1.25; letter-spacing: -.045em;
}
.izquierda h2::after {
  display: block; width: 66px; height: 2px; margin: 29px auto 0;
  background: var(--cafe-hover); content: ""; opacity: .78;
}
.derecha {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; min-height: 100svh;
  padding: clamp(36px, 6vw, 88px);
  background:
    radial-gradient(ellipse at 100% 0%, rgba(230,211,168,.18), transparent 46%),
    var(--crema);
}
.caja {
  width: 100%; max-width: 470px; padding: clamp(34px, 4.2vw, 58px);
  border: 1px solid rgba(182,154,112,.42); border-radius: 18px;
  background: rgba(255,253,248,.88);
  box-shadow: 0 24px 70px rgba(43,22,8,.09), 0 3px 10px rgba(43,22,8,.035);
}
.caja h1 {
  margin: 0 0 12px; color: var(--cafe);
  font-family: "Segoe UI", Arial, sans-serif;
  font-size: clamp(35px, 3.2vw, 44px); font-weight: 700;
  line-height: 1.12; letter-spacing: -.045em; text-align: left;
}
.caja h1::after {
  display: block; width: 42px; height: 2px; margin-top: 22px;
  background: var(--dorado); content: "";
}
#login-form { display: flex; flex-direction: column; margin-top: 32px; }
.campo { display: flex; flex-direction: column; gap: 10px; margin-bottom: 21px; }
.campo > label { color: var(--cafe); font-size: 13px; font-weight: 700; letter-spacing: .035em; }
.caja input {
  width: 100%; min-height: 58px; margin: 0; padding: 17px 18px;
  border: 1px solid #d8c5a5; border-radius: 9px; outline: none;
  background: #fffdf8; color: var(--cafe-profundo);
  font: inherit; font-size: 15px;
  transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
.caja input::placeholder { color: #9a8770; opacity: 1; }
.caja input:hover { border-color: var(--cafe-medio); }
.caja input:focus {
  border-color: var(--cafe-hover); background: #fff;
  box-shadow: 0 0 0 4px rgba(122,74,28,.12);
}
.password-wrap { position: relative; }
.password-wrap input { padding-right: 92px; }
.toggle-password {
  position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
  min-height: 36px; padding: 7px 10px; border: 1px solid transparent;
  border-radius: 7px; background: transparent; color: var(--cafe-medio);
  font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
}
.toggle-password:hover { border-color: var(--dorado); background: var(--crema-calida); }
.toggle-password:focus-visible { outline: 3px solid rgba(122,74,28,.3); outline-offset: 2px; }
.caja input:focus-visible { outline: none; }
.caja input[aria-invalid="true"] { border-color: #9b2525; }
#mensaje { min-height: 22px; margin: -2px 0 5px; color: #9b2525; font-size: 13px; line-height: 1.5; text-align: left; }
#mensaje:empty { min-height: 5px; }
.boton {
  display: flex; align-items: center; justify-content: center;
  width: 100%; min-height: 56px; padding: 16px 20px;
  border: 1px solid var(--cafe); border-radius: 9px;
  font-family: inherit; font-size: 14px; font-weight: 700;
  letter-spacing: .025em; text-align: center; cursor: pointer;
  transition: background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.boton:focus-visible { outline: 3px solid rgba(122,74,28,.3); outline-offset: 3px; }
.boton:active { transform: translateY(1px); }
.boton.principal {
  margin-top: 12px; background: var(--cafe); color: var(--marfil);
  box-shadow: 0 8px 18px rgba(43,22,8,.15);
}
.boton.principal:hover:not(:disabled) {
  border-color: var(--cafe-hover); background: var(--cafe-hover);
  box-shadow: 0 10px 22px rgba(43,22,8,.2); transform: translateY(-1px);
}
.boton.principal:disabled { cursor: wait; opacity: .72; }
.boton.secundario {
  margin-top: 13px; border-color: #cbb38c; background: transparent; color: var(--cafe);
}
.boton.secundario:hover { border-color: var(--cafe); background: var(--crema-calida); }
.form-note { margin: 24px 0 0; color: var(--texto-secundario); font-size: 12px; line-height: 1.7; text-align: center; }
.boton:focus-visible, .boton.secundario:focus-visible { outline: 3px solid rgba(122,74,28,.35); outline-offset: 3px; }
@media (min-width: 761px) and (max-height: 700px) {
  .izquierda, .derecha { min-height: 700px; }
  .derecha { padding-block: 30px; }
  .caja { padding: 34px 40px; }
}
@media (max-width: 900px) and (min-width: 761px) {
  body { grid-template-columns: minmax(0, 1fr) minmax(390px, 1fr); }
  .derecha { padding: 30px; }
  .caja { padding: 34px 30px; }
  .izquierda { padding-inline: 28px; }
}
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; }
  .izquierda { min-height: auto; padding: 44px 24px 35px; }
  .izquierda::before { width: min(90vw, 430px); }
  .izquierda::after { width: min(74vw, 350px); }
  .izquierda img { width: 142px; }
  .izquierda h2 { max-width: 340px; margin-top: 19px; font-size: 25px; }
  .izquierda h2::after { margin-top: 19px; }
  .derecha { min-height: auto; padding: 34px 20px 56px; }
  .caja { max-width: 480px; padding: 34px clamp(24px, 7vw, 42px); }
  .caja h1 { font-size: 36px; }
  #login-form { margin-top: 27px; }
  .campo { margin-bottom: 18px; }
  .form-note { margin-top: 20px; }
}
@media (max-width: 380px) {
  .izquierda { padding-inline: 18px; }
  .derecha { padding-inline: 14px; }
  .caja { padding-inline: 22px; }
}
@media (forced-colors: active) {
  .boton, .toggle-password, .caja input { border: 1px solid ButtonText; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<section class="izquierda">
  <img src="img/logo_grande.webp" alt="Logo de Capricornio">
  <h2>Capricornio: Trabajar, persistir y avanzar</h2>
</section>

<section class="derecha">
  <div class="caja">
    <h1>Iniciar sesión</h1>

    <form id="login-form" novalidate>
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" name="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="nombre@correo.com" aria-describedby="mensaje" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" aria-describedby="mensaje" required>
          <button class="toggle-password" id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Mostrar</button>
        </div>
      </div>
      <p id="mensaje" role="alert" aria-live="assertive" aria-atomic="true"></p>
      <button class="boton principal" id="ingresar" type="submit">Iniciar sesión</button>
    </form>

    <a class="boton secundario" href="registro.html">Crear cuenta</a>
    <p class="form-note">Tu espacio de aprendizaje comienza aquí.</p>
  </div>
</section>

<script>
const formulario = document.getElementById("login-form");
const mensaje = document.getElementById("mensaje");
const boton = document.getElementById("ingresar");
const campoEmail = document.getElementById("email");
const campoPassword = document.getElementById("password");
const togglePassword = document.getElementById("toggle-password");

togglePassword.addEventListener("click", () => {
  const mostrar = campoPassword.type === "password";
  campoPassword.type = mostrar ? "text" : "password";
  togglePassword.textContent = mostrar ? "Ocultar" : "Mostrar";
  togglePassword.setAttribute("aria-pressed", String(mostrar));
  campoPassword.focus();
});

function mostrarError(texto, campo = null) {
  mensaje.textContent = texto;
  campoEmail.removeAttribute("aria-invalid");
  campoPassword.removeAttribute("aria-invalid");
  if (campo) {
    campo.setAttribute("aria-invalid", "true");
    campo.focus();
  }
}

formulario.addEventListener("submit", async (evento) => {
  evento.preventDefault();
  mensaje.textContent = "";
  campoEmail.removeAttribute("aria-invalid");
  campoPassword.removeAttribute("aria-invalid");
  const email = campoEmail.value.trim();
  const password = campoPassword.value;

  if (!email || !campoEmail.validity.valid) {
    mostrarError("Escribe un correo electrónico válido.", campoEmail);
    return;
  }
  if (!password) {
    mostrarError("Escribe tu contraseña para continuar.", campoPassword);
    return;
  }

  boton.disabled = true;
  boton.setAttribute("aria-busy", "true");
  boton.textContent = "Verificando...";

  const campos = new FormData(formulario);

  try {
    const respuesta = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        email,
        password
      })
    });

    const resultado = await respuesta.json().catch(() => ({}));

    if (!respuesta.ok) {
      throw new Error(resultado.detail || "Correo o contraseña incorrectos.");
    }

    const estado = await fetch("/api/diagnostic/latest", {
      method: "GET",
      credentials: "same-origin"
    });

    if (!estado.ok) {
      const detalle = await estado.json().catch(() => ({}));
      throw new Error(
        `Error consultando progreso (${estado.status}): ${detalle.detail || "Respuesta del servidor no válida."}`
      );
    }

    const datos = await estado.json();

    window.location.href = datos.diagnostic
      ? "plan.html"
      : "diagnostico.html";

  } catch (error) {
    mensaje.textContent = error.message || "No se pudo conectar con el servidor.";
    boton.disabled = false;
    boton.removeAttribute("aria-busy");
    boton.textContent = "Iniciar sesión";
  }
});
</script>

</body>
</html>
