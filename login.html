<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capricornio - Iniciar sesión</title>
<style>
:root {
  color-scheme: light;
  --cafe-profundo: #2b1608;
  --cafe: #3b2314;
  --cafe-medio: #5a3a1e;
  --cafe-hover: #7a4a1c;
  --crema: #fffaf0;
  --crema-calida: #f6ecd6;
  --dorado-suave: #e6d3a8;
  --dorado: #b69a70;
  --texto-secundario: #8a735c;
  --marfil: #f3e6c8;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--crema); }
body {
  min-height: 100vh; min-height: 100svh; margin: 0;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  color: var(--cafe-profundo); background: var(--crema);
  font-family: "Trebuchet MS", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
.izquierda {
  position: relative; isolation: isolate; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; min-height: 100svh;
  padding: clamp(36px, 6vw, 76px) 30px;
  text-align: center;
  background: radial-gradient(ellipse at 50% 42%, var(--crema-calida) 0%, var(--dorado-suave) 100%);
}
.izquierda::before, .izquierda::after {
  position: absolute; z-index: -1; content: ""; pointer-events: none;
  border: 1px solid rgba(90, 58, 30, .12); border-radius: 50%;
}
.izquierda::before { width: min(76vw, 660px); aspect-ratio: 1; }
.izquierda::after { width: min(62vw, 530px); aspect-ratio: 1; }
.izquierda img {
  display: block; width: min(230px, 48vw); height: auto;
  mix-blend-mode: multiply;
  filter: drop-shadow(0 10px 18px rgba(43, 22, 8, .08));
}
.izquierda h2 {
  max-width: 390px; margin: 30px 0 0; color: var(--cafe-profundo);
  font-family: Georgia, "Palatino Linotype", serif;
  font-size: clamp(25px, 2.5vw, 34px); font-weight: 400;
  line-height: 1.3; letter-spacing: -.025em;
}
.izquierda h2::after {
  display: block; width: 54px; height: 2px; margin: 25px auto 0;
  background: var(--cafe-hover); content: ""; opacity: .72;
}
.derecha {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; min-height: 100svh;
  padding: clamp(32px, 5vw, 72px) clamp(24px, 5vw, 64px);
  background: var(--crema);
}
.caja { width: 100%; max-width: 390px; }
.caja h1 {
  margin: 0 0 38px; color: var(--cafe);
  font-family: Georgia, "Palatino Linotype", serif;
  font-size: clamp(34px, 3vw, 42px); font-weight: 400;
  line-height: 1.15; letter-spacing: -.035em; text-align: center;
}
#login-form { display: flex; flex-direction: column; }
.caja input {
  width: 100%; min-height: 56px; margin: 0 0 17px; padding: 16px 17px;
  border: 1px solid var(--dorado); border-radius: 9px; outline: none;
  background: var(--crema); color: var(--cafe-profundo);
  font: inherit; font-size: 15px;
  transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
.caja input::placeholder { color: var(--texto-secundario); opacity: 1; }
.caja input:hover { border-color: var(--cafe-medio); }
.caja input:focus {
  border-color: var(--cafe-hover); background: #fffdf8;
  box-shadow: 0 0 0 3px rgba(122, 74, 28, .13);
}
.boton {
  display: flex; align-items: center; justify-content: center;
  width: 100%; min-height: 54px; margin-top: 13px; padding: 15px 20px;
  border: 1px solid var(--cafe); border-radius: 9px;
  font-family: inherit; font-size: 15px; font-weight: 700;
  letter-spacing: .01em; text-align: center; cursor: pointer;
  transition: background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.boton:focus-visible { outline: 3px solid rgba(122, 74, 28, .3); outline-offset: 3px; }
.boton:active { transform: translateY(1px); }
.boton.principal {
  background: var(--cafe); color: var(--marfil);
  box-shadow: 0 5px 12px rgba(43, 22, 8, .12);
}
.boton.principal:hover:not(:disabled) {
  border-color: var(--cafe-hover); background: var(--cafe-hover);
  box-shadow: 0 7px 16px rgba(43, 22, 8, .16);
}
.boton.principal:disabled { cursor: wait; opacity: .72; }
.boton.secundario { border-color: var(--dorado); background: transparent; color: var(--cafe); }
.boton.secundario:hover { border-color: var(--cafe); background: var(--dorado-suave); }
#mensaje { min-height: 20px; margin: 0 0 4px; color: #9b2525; font-size: 13px; line-height: 1.5; text-align: center; }

.campo { display: flex; flex-direction: column; gap: 8px; margin-bottom: 17px; }
.campo > label { color: var(--cafe); font-size: 14px; font-weight: 700; letter-spacing: .01em; }
.campo input { margin: 0; }
.password-wrap { position: relative; }
.password-wrap input { padding-right: 88px; }
.toggle-password {
  position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
  min-height: 36px; padding: 7px 10px; border: 1px solid transparent;
  border-radius: 7px; background: transparent; color: var(--cafe-medio);
  font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
}
.toggle-password:hover { border-color: var(--dorado); background: var(--crema-calida); }
.toggle-password:focus-visible { outline: 3px solid rgba(122, 74, 28, .3); outline-offset: 2px; }
.caja input:focus-visible { outline: none; }
.caja input[aria-invalid="true"] { border-color: #9b2525; }
#mensaje { min-height: 22px; margin: 0 0 4px; color: #9b2525; font-size: 13px; line-height: 1.5; text-align: left; }
#mensaje:empty { min-height: 8px; }
.form-note { margin: 18px 0 0; color: var(--texto-secundario); font-size: 12px; line-height: 1.6; text-align: center; }
.boton:focus-visible, .boton.secundario:focus-visible { outline: 3px solid rgba(122, 74, 28, .35); outline-offset: 3px; }
@media (min-width: 761px) and (max-height: 650px) {
  .izquierda, .derecha { min-height: 650px; }
  .derecha { padding-block: 30px; }
}
@media (max-width: 760px) {
  .campo { margin-bottom: 15px; }
  .form-note { margin-top: 16px; }
}
@media (forced-colors: active) {
  .boton, .toggle-password, .caja input { border: 1px solid ButtonText; }
}

@media (max-width: 760px) {
  body { grid-template-columns: 1fr; }
  .izquierda { min-height: auto; padding: 42px 24px 34px; }
  .izquierda::before { width: min(90vw, 430px); }
  .izquierda::after { width: min(74vw, 350px); }
  .izquierda img { width: 132px; }
  .izquierda h2 { max-width: 320px; margin-top: 16px; font-size: 23px; }
  .izquierda h2::after { margin-top: 17px; }
  .derecha { min-height: auto; padding: 42px 24px 56px; }
  .caja { max-width: 420px; }
  .caja h1 { margin-bottom: 28px; font-size: 34px; }
}
@media (max-width: 380px) {
  .izquierda { padding-inline: 18px; }
  .derecha { padding-inline: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<section class="izquierda">
  <img src="img/logo_grande.webp" alt="Logo de Capricornio">
  <h2>Capricornio: Trabajar, persistir y avanzar</h2>
</section>

<section class="derecha">
  <div class="caja">
    <h1>Iniciar sesión</h1>

    <form id="login-form" novalidate>
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" name="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="nombre@correo.com" aria-describedby="mensaje" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" aria-describedby="mensaje" required>
          <button class="toggle-password" id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Mostrar</button>
        </div>
      </div>
      <p id="mensaje" role="alert" aria-live="assertive" aria-atomic="true"></p>
      <button class="boton principal" id="ingresar" type="submit">Iniciar sesión</button>
    </form>

    <a class="boton secundario" href="registro.html">Crear cuenta</a>
    <p class="form-note">Tu espacio de aprendizaje comienza aquí.</p>
  </div>
</section>

<script>
const formulario = document.getElementById("login-form");
const mensaje = document.getElementById("mensaje");
const boton = document.getElementById("ingresar");
const campoEmail = document.getElementById("email");
const campoPassword = document.getElementById("password");
const togglePassword = document.getElementById("toggle-password");

togglePassword.addEventListener("click", () => {
  const mostrar = campoPassword.type === "password";
  campoPassword.type = mostrar ? "text" : "password";
  togglePassword.textContent = mostrar ? "Ocultar" : "Mostrar";
  togglePassword.setAttribute("aria-pressed", String(mostrar));
  campoPassword.focus();
});

function mostrarError(texto, campo = null) {
  mensaje.textContent = texto;
  campoEmail.removeAttribute("aria-invalid");
  campoPassword.removeAttribute("aria-invalid");
  if (campo) {
    campo.setAttribute("aria-invalid", "true");
    campo.focus();
  }
}

formulario.addEventListener("submit", async (evento) => {
  evento.preventDefault();
  mensaje.textContent = "";
  campoEmail.removeAttribute("aria-invalid");
  campoPassword.removeAttribute("aria-invalid");
  const email = campoEmail.value.trim();
  const password = campoPassword.value;

  if (!email || !campoEmail.validity.valid) {
    mostrarError("Escribe un correo electrónico válido.", campoEmail);
    return;
  }
  if (!password) {
    mostrarError("Escribe tu contraseña para continuar.", campoPassword);
    return;
  }

  boton.disabled = true;
  boton.setAttribute("aria-busy", "true");
  boton.textContent = "Verificando...";

  const campos = new FormData(formulario);

  try {
    const respuesta = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        email,
        password
      })
    });

    const resultado = await respuesta.json().catch(() => ({}));

    if (!respuesta.ok) {
      throw new Error(resultado.detail || "Correo o contraseña incorrectos.");
    }

    const estado = await fetch("/api/diagnostic/latest", {
      method: "GET",
      credentials: "same-origin"
    });

    if (!estado.ok) {
      const detalle = await estado.json().catch(() => ({}));
      throw new Error(
        `Error consultando progreso (${estado.status}): ${detalle.detail || "Respuesta del servidor no válida."}`
      );
    }

    const datos = await estado.json();

    window.location.href = datos.diagnostic
      ? "plan.html"
      : "diagnostico.html";

  } catch (error) {
    mensaje.textContent = error.message || "No se pudo conectar con el servidor.";
    boton.disabled = false;
    boton.removeAttribute("aria-busy");
    boton.textContent = "Iniciar sesión";
  }
});
</script>

</body>
</html>
