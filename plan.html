<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capricornio - Mi plan</title><link rel="stylesheet" href="css/estilos.css">
<style>
.area{margin:18px 0}.area h3{margin-bottom:8px}.lesson{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;margin:8px 0;background:#fbf4e2;border:1px solid #b89a70;border-radius:8px;flex-wrap:wrap}.muted{font-size:13px;color:#725b43}.status{font-size:13px;font-weight:bold}.lesson a{white-space:nowrap}
</style></head>
<body>
<header class="barra"><div class="logo"><span class="insignia"><img src="img/logo.webp" alt=""></span>CAPRICORNIO</div><nav><a href="plan.html">Mi plan</a><a href="diagnostico.html">Diagnóstico</a><a href="#" id="salir">Cerrar sesión</a></nav></header>
<main class="contenedor">
<h1>Mi plan de aprendizaje</h1><p id="saludo">Cargando tu ruta...</p>
<section class="tarjeta"><h3>Progreso real</h3><div class="progreso"><div id="barra" style="width:0%"></div></div><p id="resumen">Consultando lecciones completadas...</p></section>
<p id="aviso" role="status" aria-live="polite"></p><h2 style="margin-top:24px">Rutas de aprendizaje</h2><div id="rutas"></div>
</main><footer class="pie-pagina">Capricornio · Trabajar, persistir y avanzar</footer>
<script>
(async()=>{
 const $=id=>document.getElementById(id);
 async function api(url,opts={}){const r=await fetch(url,{credentials:"same-origin",...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||"No se pudo cargar tu información.");return d}
 $("salir").onclick=async e=>{e.preventDefault();await api("/api/logout",{method:"POST"});location.href="login.html"};
 try{
  const [me,data]=await Promise.all([api("/api/me"),api("/api/learning/catalog")]);
  $("saludo").textContent="Hola, "+me.user.name+". Tu ruta recomendada es "+data.recommended_area+".";
  $("barra").style.width=data.progress_percent+"%";
  $("resumen").textContent=data.completed_lessons+" de "+data.total_lessons+" lecciones completadas ("+data.progress_percent+"%).";
  const root=$("rutas");
  data.tracks.forEach(track=>{
   const section=document.createElement("section");section.className="tarjeta area";
   const h=document.createElement("h3");h.textContent=track.area;section.append(h);
   const p=document.createElement("p");p.className="muted";p.textContent=track.completed+" de "+track.total+" lecciones · "+track.progress_percent+"%";section.append(p);
   const bar=document.createElement("div");bar.className="progreso";const fill=document.createElement("div");fill.style.width=track.progress_percent+"%";bar.append(fill);section.append(bar);
   track.lessons.forEach((lesson,i)=>{
    const row=document.createElement("div");row.className="lesson";
    const left=document.createElement("div");const title=document.createElement("strong");title.textContent=(i+1)+". "+lesson.title;const meta=document.createElement("div");meta.className="muted";meta.textContent=lesson.module+" · "+lesson.level;left.append(title,meta);
    const right=document.createElement("div");const status=document.createElement("span");status.className="status";status.textContent=lesson.completed?"Completada":"Pendiente";status.style.marginRight="12px";
    const link=document.createElement("a");link.className="boton "+(lesson.completed?"claro":"");link.href="leccion.html?id="+encodeURIComponent(lesson.id);link.textContent=lesson.completed?"Repasar":"Estudiar";right.append(status,link);row.append(left,right);section.append(row);
   });
   root.append(section);
  });
 }catch(e){$("aviso").textContent=e.message+" Inicia sesión para consultar tu plan."}
})();
</script></body></html>
