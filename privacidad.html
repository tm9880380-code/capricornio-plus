<body><main class="legal"><a class="back" href="login.html">← Volver a Capricornio</a><h1>Privacidad y datos personales</h1><p><strong>Versión:</strong> 22 de noviembre de 2026</p>
<div class="notice"><strong>Importante:</strong> Capricornio Plus es software autoalojable. La persona o institución que instala y opera cada instancia determina para qué y cómo trata los datos y actúa como responsable. Antes de utilizarla con estudiantes reales, debe completar sus datos de contacto, revisar la normativa aplicable y establecer procedimientos de atención de derechos.</div>
<h2>1. Datos que puede tratar la plataforma</h2><ul><li>Nombre y correo electrónico de la cuenta.</li><li>Hash de contraseña y hash del token de sesión.</li><li>Objetivo de aprendizaje, respuestas de diagnóstico y ejercicios, competencias estimadas y lecciones completadas.</li></ul><p>Las contraseñas no se guardan en texto plano. La base SQLite se administra en la instalación correspondiente.</p>
<h2>2. Finalidades</h2><p>Los datos se utilizan para crear y mantener cuentas, autenticar sesiones, orientar rutas de aprendizaje y guardar el progreso educativo. La instalación debe limitar el tratamiento a las finalidades informadas y definir la base jurídica aplicable.</p>
<h2>3. Ejecución de ejercicios</h2><p>El código Python de práctica se ejecuta en un Web Worker del navegador y no se envía al servidor de Capricornio. El entorno descarga Pyodide desde jsDelivr cuando se inicia por primera vez, por lo que el navegador contacta a ese proveedor para obtener los archivos del motor.</p>
<h2>4. Cookies y almacenamiento</h2><p>La sesión utiliza la cookie <code>capricornio_session</code>. La interfaz también puede guardar preferencias de accesibilidad en el almacenamiento local del navegador. Consulta la <a href="cookies.html">política de cookies y almacenamiento local</a>.</p>
<h2>5. Conservación y eliminación</h2><p>Los datos de cuenta y progreso se guardan en la base SQLite de la instalación. La persona administradora debe establecer plazos de conservación, respaldos y un procedimiento seguro para atender solicitudes de consulta, corrección o eliminación. La interfaz actual no ofrece autoservicio completo de eliminación de cuenta.</p>
<h2>6. Menores de edad</h2><p>El uso con menores requiere evaluación jurídica, institucional, de seguridad y protección de datos antes de cualquier piloto con información real. Deben aplicarse las autorizaciones y salvaguardas exigidas por la normativa local.</p>
<h2>7. Recursos de terceros</h2><p>La biblioteca puede enlazar a sitios externos. Al abrirlos, se aplican sus propias políticas. La instalación debe revisar cualquier integración adicional antes de habilitarla.</p>
<h2>8. Derechos y contacto del responsable</h2><p>Para ejercer derechos sobre datos personales, contacta a la institución o persona que administra esta instalación. Antes de publicar el servicio, el administrador debe completar y mostrar aquí el nombre legal del responsable, correo de contacto y dirección o canal de atención.</p>
