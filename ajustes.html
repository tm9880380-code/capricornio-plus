<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capricornio · Ajustes</title><link rel="stylesheet" href="css/estilos.css"></head><body><header class="barra"><div class="logo"><span class="insignia"><img src="img/logo.webp" alt=""></span>CAPRICORNIO</div></header><main class="contenedor"><h1>Ajustes de aprendizaje</h1><p>Configura cómo se presenta tu espacio de estudio en este dispositivo.</p><section class="panel"><h2>Lectura y visualización</h2><label style="display:flex;gap:12px;align-items:center;margin:16px 0"><input id="large" type="checkbox"> Texto más grande</label><label style="display:flex;gap:12px;align-items:center;margin:16px 0"><input id="reduce" type="checkbox"> Reducir animaciones</label><label style="display:flex;gap:12px;align-items:center;margin:16px 0"><input id="contrast" type="checkbox"> Mayor contraste</label><button class="boton" id="save">Guardar preferencias</button><p id="status" role="status" aria-live="polite"></p></section><section class="panel"><h2>Tu cuenta</h2><p id="account">Consultando cuenta…</p><a class="boton claro" href="ayuda.html">Necesito ayuda</a></section></main><script>
(()=>{const keys=["large","reduce","contrast"];const status=document.getElementById("status");for(const k of keys)document.getElementById(k).checked=localStorage.getItem("cp_"+k)==="1";function apply(){document.body.classList.toggle("cp-large",localStorage.getItem("cp_large")==="1");document.body.classList.toggle("cp-contrast",localStorage.getItem("cp_contrast")==="1");document.documentElement.style.scrollBehavior=localStorage.getItem("cp_reduce")==="1"?"auto":"smooth";}apply();document.getElementById("save").addEventListener("click",()=>{for(const k of keys)localStorage.setItem("cp_"+k,document.getElementById(k).checked?"1":"0");apply();status.textContent="Preferencias guardadas en este dispositivo.";});fetch("/api/me",{credentials:"same-origin"}).then(r=>r.ok?r.json():Promise.reject()).then(d=>document.getElementById("account").textContent=d.user.name+" · "+d.user.email+" · Ruta: "+d.user.learning_goal).catch(()=>document.getElementById("account").textContent="Inicia sesión para consultar los datos de tu cuenta.");})();
</script><style>.cp-large{font-size:18px}.cp-large p,.cp-large label{font-size:1.1em}.cp-contrast{--cp-line:#67839b;--cp-muted:#233e55}.cp-contrast p{color:#102b46!important}.cp-contrast .panel{border:2px solid #155b91}</style><script src="js/app-shell.js" defer></script></body></html>
