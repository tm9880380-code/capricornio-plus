name: Capricornio CI
on:
  push:
    branches: [main, entrega-capricornio-plus]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend tests
      - run: pytest -q
      - name: Package source ZIP
        run: git archive --format=zip --output=capricornio-plus-entrega.zip HEAD
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: capricornio-plus-entrega
          path: capricornio-plus-entrega.zip
          if-no-files-found: error
          retention-days: 7
